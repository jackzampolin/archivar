[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archivar-scanner"
version = "0.1.0"
description = "Scanner control service for Archivar book scanner"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "opencv-python>=4.8",
    "requests>=2.31",
    "zeroconf>=0.131",
    "python-socketio>=5.10",
    "gevent>=24.0",
    "gevent-websocket>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.1",
]

[project.scripts]
scanner = "scanner.main:main"
